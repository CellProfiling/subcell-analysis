# Read by `python -m subcell.inference.attention -c configs/config_attention_hpa.yaml`: attention maps of the SubCell
# encoders, Cell-DINO-HPA and DINO4Cells-HPA (``dino``) on the HPA cells, scored against the input channels (Fig. 3f,g).
- name: subcell_rybg_mae
  crops_folder: ${HPA_DATA}
  metadata_file: ${HPA_DATA}/crops_metadata.csv
  inference_folder: ${SUBCELL_ROOT}/hpa_attn_corr
  batch_size: 24
  num_workers: 14
  model:
    output_attentions: last
    args:
      vit_model:
        hidden_size: 768
        num_hidden_layers: 12
        num_attention_heads: 12
        intermediate_size: 3072
        hidden_act: gelu
        hidden_dropout_prob: 0.0
        attention_probs_dropout_prob: 0.0
        initializer_range: 0.02
        layer_norm_eps: 1.0e-12
        image_size: 448
        patch_size: 16
        num_channels: 4
        qkv_bias: true
      pool_model:
        dim: 768
        int_dim: 512
        num_heads: 2
    weight_path: ${SUBCELL_WEIGHTS}/all_channels_MAE-CellS-ProtS-Pool.pth
  crop_params:
    mask_cell: true
    pad: -1
    crop: 640
    resize_to: -1
    channels:
    - red
    - yellow
    - blue
    - green
