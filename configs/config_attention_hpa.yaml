- name: cell_dino_hpa_vitl16
  crops_folder: ${HPA_DATA}
  metadata_file: ${HPA_DATA}/crops_metadata.csv
  inference_folder: ${SUBCELL_ROOT}/hpa_attn_corr
  batch_size: 24
  num_workers: 14
  model:
    entrypoint: cell_dino_hpa_vitl16
    repo_path: ${DINOV2_REPO}
    weight_path: ${BASELINE_WEIGHTS}/cell_dino/cell_dino_vitl16_pretrain_hpa_sc-d3ab8938.pth
    output_attentions: true
  crop_params:
    mask_cell: true
    pad: -1
    crop: 384
    resize_to: -1
    channels:
    - red
    - green
    - blue
    - yellow
- name: dino
  crops_folder: ${HPA_DATA}
  metadata_file: ${HPA_DATA}/crops_metadata.csv
  inference_folder: ${SUBCELL_ROOT}/hpa_attn_corr
  batch_size: 24
  num_workers: 14
  model:
    args:
      num_channels: 4
      patch_size: 16
      embed_dim: 768
      depth: 12
      num_heads: 12
      mlp_ratio: 4
      qkv_bias: true
    weight_path: ${BASELINE_WEIGHTS}/dino_weights/HPA_single_cell_model_checkpoint.pth
  crop_params:
    mask_cell: true
    pad: -1
    crop: 512
    resize_to: -1
    channels:
    - red
    - green
    - blue
    - yellow
