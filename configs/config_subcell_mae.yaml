# Read by `python -m subcell.inference.hpa -c configs/config_subcell_mae.yaml`: MAE-CellS-ProtS-Pool features
# (MT, ER, DNA, protein) of the HPA v23 cells, written to config.features("MAE-CellS-ProtS-Pool"). Input of
# the localization benchmarks (Fig. 2a-c) and the feature analyses (Fig. 3, Extended Data Figs. 3 and 8).
-
    name: subcell_rybg_mae
    crops_folder: ${HPA_DATA}
    metadata_file: ${HPA_DATA}/crops_metadata.csv
    dataset: HPATestDataset2
    inference_folder: ${SUBCELL_ROOT}/hpa_inference
    output_path: ${SUBCELL_ROOT}/features/MAE-CellS-ProtS-Pool/hpa_features/all_features.pth
    save_attention: False
    save_patch_features: False
    model:
        args:
            vit_model:
                hidden_size: 768
                num_hidden_layers: 12
                num_attention_heads: 12
                intermediate_size: 3072
                hidden_act: "gelu"
                hidden_dropout_prob: 0.0
                attention_probs_dropout_prob: 0.0
                initializer_range: 0.02
                layer_norm_eps: 1.e-12
                image_size: 448
                patch_size: 16
                num_channels: 4
                qkv_bias: True
            pool_model:
                dim: 768
                int_dim: 512
                num_heads: 2
        weight_path: ${SUBCELL_WEIGHTS}/all_channels_MAE-CellS-ProtS-Pool.pth
    crop_params:
        mask_cell: True
        pad: -1
        crop: 640
        resize_to: -1
        channels:
            - "red"
            - "yellow"
            - "blue"
            - "green"
