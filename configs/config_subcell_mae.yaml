model:
    args:
        vit_model:
            hidden_size: 768
            num_hidden_layers: 12
            num_attention_heads: 12
            intermediate_size: 3072
            hidden_act: "gelu"
            hidden_dropout_prob: 0.0
            attention_probs_dropout_prob: 0.0
            initializer_range: 0.02
            layer_norm_eps: 1.e-12
            image_size: 448
            patch_size: 16
            num_channels: 4
            qkv_bias: True
        pool_model:
            dim: 768
            int_dim: 512
            num_heads: 2
    weight_path: /home/groups/emmalu/ankitgpt/subcell_models/all_channels_MAE-CellS-ProtS-Pool.pth
crop_params:
    pad: -1
    crop: 640
    resize_to: -1
    channels:
        - "red"
        - "yellow"
        - "blue"
        - "green"

