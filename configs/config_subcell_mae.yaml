name: subcell_rybg_mae
crops_folder: /scratch/groups/emmalu/subcell_ankit/b2aicropsmasked/HPACellSegmentator_crops_masked # /proj/hpa_subcell/hpa_comp_data/Kaggle/test_images/crops #/proj/hpa_subcell/hpa_data/crops
metadata_file: /scratch/groups/emmalu/subcell_ankit/full_subcell_crops_all_z_filtered.csv
inference_folder: /scratch/groups/emmalu/subcell_ankit/b2ai
