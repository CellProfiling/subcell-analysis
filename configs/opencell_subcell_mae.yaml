# Read by `python -m subcell.inference.opencell -c configs/opencell_subcell_mae.yaml`: MAE-CellS-ProtS-Pool (DNA + protein)
# features on the OpenCell crops (Fig. 2e).
    -
        name: subcell_bg_mae
        crops_folder: ${OPENCELL_DATA}/crops
        metadata_file: ${OPENCELL_DATA}/crops_metadata.csv
        inference_folder: ${SUBCELL_ROOT}/opencell
        resize: true
        save_attention: true
        normalization: perchannel
        model:
            args:
                vit_model:
                    hidden_size: 768
                    num_hidden_layers: 12
                    num_attention_heads: 12
                    intermediate_size: 3072
                    hidden_act: "gelu"
                    hidden_dropout_prob: 0.0
                    attention_probs_dropout_prob: 0.0
                    initializer_range: 0.02
                    layer_norm_eps: 1.e-12
                    image_size: 448
                    patch_size: 16
                    num_channels: 2
                    qkv_bias: True
                pool_model:
                    dim: 768
                    int_dim: 512
                    num_heads: 2
            weight_path: ${SUBCELL_WEIGHTS}/DNA-Protein_MAE-CellS-ProtS-Pool.pth
