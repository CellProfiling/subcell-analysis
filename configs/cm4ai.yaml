- name: dino
  dataset: HPATestDataset
  crops_folder: ${SUBCELL_ROOT}/bridge2ai_crops
  metadata_file: ${CM4AI_DATA}/full_subcell_crops_all_z_filtered.csv
  inference_folder: ${SUBCELL_ROOT}/b2ai
  save_patch_features: false
  output_path: ${SUBCELL_ROOT}/features/DINO4Cells-HPA/b2ai_features/all_features.pth
  feature_meta_cols:
  - id
  - protein
  - gene_name
  - fov
  - z_plane
  - treatment
  - cell
  model:
    args:
      num_channels: 4
      patch_size: 16
      embed_dim: 768
      depth: 12
      num_heads: 12
      mlp_ratio: 4
      qkv_bias: true
    weight_path: ${BASELINE_WEIGHTS}/dino_weights/HPA_single_cell_model_checkpoint.pth
  crop_params:
    pad: -1
    crop: 512
    resize_to: -1
    channels:
    - red
    - green
    - blue
    - yellow
