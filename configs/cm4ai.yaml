# Read by `python -m subcell.inference.hpa -c configs/cm4ai.yaml`: features of every compared model on the CM4AI
# MDA-MB-468 crops (Fig. 4a-c, Extended Data Fig. 5).
- name: subcell_rybg_mae
  dataset: HPATestDataset
  crops_folder: ${SUBCELL_ROOT}/bridge2ai_crops
  metadata_file: ${CM4AI_DATA}/full_subcell_crops_all_z_filtered.csv
  inference_folder: ${SUBCELL_ROOT}/b2ai
  save_patch_features: false
  output_path: ${SUBCELL_ROOT}/features/MAE-CellS-ProtS-Pool/b2ai_features/all_features.pth
  feature_meta_cols:
  - id
  - protein
  - gene_name
  - fov
  - z_plane
  - treatment
  - cell
  model:
    args:
      vit_model:
        hidden_size: 768
        num_hidden_layers: 12
        num_attention_heads: 12
        intermediate_size: 3072
        hidden_act: gelu
        hidden_dropout_prob: 0.0
        attention_probs_dropout_prob: 0.0
        initializer_range: 0.02
        layer_norm_eps: 1.0e-12
        image_size: 448
        patch_size: 16
        num_channels: 4
        qkv_bias: true
      pool_model:
        dim: 768
        int_dim: 512
        num_heads: 2
    weight_path: ${SUBCELL_WEIGHTS}/all_channels_MAE-CellS-ProtS-Pool.pth
    output_attentions: false
  crop_params:
    pad: -1
    crop: 640
    resize_to: -1
    channels:
    - red
    - yellow
    - blue
    - green
