                    qkv_bias: True
                pool_model:
                    dim: 768
                    int_dim: 512
                    num_heads: 2
            weight_path: ${SUBCELL_WEIGHTS}/MT-DNA-Protein_ViT-ProtS-Pool.pth
    -
