# Read by `python -m subcell.inference.yeast -c configs/config_subcell_vit_yeast.yaml`: ViT-ProtS-Pool features on the yeast
# localization and cell-cycle datasets at three input sizes (Fig. 2f,h,j).
    -
        name: subcell_rbg_vit
        crops_folder: ${YEAST_DATA}/datasets/
        inference_folder: ${SUBCELL_ROOT}/yeast
        resize: 256
        save_attention: true
        model:
            args:
                vit_model:
                    hidden_size: 768
                    num_hidden_layers: 12
                    num_attention_heads: 12
                    intermediate_size: 3072
                    hidden_act: "gelu"
                    hidden_dropout_prob: 0.0
                    attention_probs_dropout_prob: 0.0
                    initializer_range: 0.02
                    layer_norm_eps: 1.e-12
                    image_size: 448
                    patch_size: 16
                    num_channels: 3
                    qkv_bias: True
                pool_model:
                    dim: 768
                    int_dim: 512
                    num_heads: 2
            weight_path: ${SUBCELL_WEIGHTS}/MT-DNA-Protein_ViT-ProtS-Pool.pth

    -
        name: subcell_rbg_vit
        crops_folder: ${YEAST_DATA}/datasets/
        inference_folder: ${SUBCELL_ROOT}/yeast
        resize: 512
        save_attention: true
        model:
            args:
                vit_model:
