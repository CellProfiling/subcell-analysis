# Read by `python -m subcell.inference.allencell -c configs/config_subcell_vit_allen.yaml`: ViT-ProtS-Pool features on Allen Cell
# projections for cell-cycle stage: DNA + structure (bg) or DNA + structure + plasma membrane (rbg) channels, three channel
# combinations x two normalizations (Fig. 2g,i; Supplementary Table 10). The crops are built by subcell.inference.allencell_crops.
- &concat_perchannel
  name: subcell_bg_vit
  crops_folder: ${SUBCELL_ROOT}/allencell/crop_subcell
  metadata_file: ${ALLENCELL_DATA}/manifest.csv
  inference_folder: ${SUBCELL_ROOT}/allencell
  channel_combination: concat
  normalization: perchannel
  save_attention: true
  model:
    args:
      vit_model: {hidden_size: 768, num_hidden_layers: 12, num_attention_heads: 12, intermediate_size: 3072, hidden_act: gelu,
          hidden_dropout_prob: 0.0, attention_probs_dropout_prob: 0.0, initializer_range: 0.02, layer_norm_eps: 1.0e-12, image_size: 448,
          patch_size: 16, num_channels: 2, qkv_bias: true}
      pool_model: &pool {dim: 768, int_dim: 512, num_heads: 2}
    weight_path: ${SUBCELL_WEIGHTS}/DNA-Protein_ViT-ProtS-Pool.pth
- <<: *concat_perchannel
  channel_combination: concat
  normalization: perimage
  save_attention: false
- <<: *concat_perchannel
  channel_combination: nuc_prot_only
  normalization: perchannel
  save_attention: false
- <<: *concat_perchannel
  channel_combination: nuc_prot_only
  normalization: perimage
  save_attention: false
- <<: *concat_perchannel
  name: subcell_rbg_vit
  channel_combination: plasma_nuc_prot
  normalization: perchannel
  save_attention: false
  model: &mt_dna_model
    args:
      vit_model: {hidden_size: 768, num_hidden_layers: 12, num_attention_heads: 12, intermediate_size: 3072, hidden_act: gelu,
          hidden_dropout_prob: 0.0, attention_probs_dropout_prob: 0.0, initializer_range: 0.02, layer_norm_eps: 1.0e-12, image_size: 448,
          patch_size: 16, num_channels: 3, qkv_bias: true}
      pool_model: *pool
    weight_path: ${SUBCELL_WEIGHTS}/MT-DNA-Protein_ViT-ProtS-Pool.pth
- <<: *concat_perchannel
  name: subcell_rbg_vit
  channel_combination: plasma_nuc_prot
  normalization: perimage
  save_attention: false
  model: *mt_dna_model
